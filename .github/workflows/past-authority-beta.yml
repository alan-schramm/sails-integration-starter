name: Past Authority Beta Scenario

on:
  pull_request:
    paths:
      - '.github/workflows/past-authority-beta.yml'
      - 'examples/past-authority.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROTOCOL_REPOSITORY: alan-schramm/Sails-Protocol
  PROTOCOL_SOURCE_SHA: deb4537726c4376c7693f0804fbfd7389e322e30
  STARTER_BASE_URL: http://127.0.0.1:3000
  STARTER_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  past-authority-public-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sails_protocol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout exact external starter source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.STARTER_SOURCE_SHA }}
          path: starter

      - name: Checkout exact Sails Protocol source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.PROTOCOL_REPOSITORY }}
          ref: ${{ env.PROTOCOL_SOURCE_SHA }}
          path: sails-protocol
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install external registry consumer
        working-directory: starter
        run: npm ci

      - name: Record published SDK baseline
        working-directory: starter
        run: |
          npm ls @satsails/p2p-trading-sdk@0.2.0
          npm ls @satsails/sdk-react@0.2.0
          npm ls @satsails/p2p-schemas@0.2.0
          node - <<'NODE' > registry-baseline.json
          const fs = require('fs')
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          const names = ['@satsails/p2p-trading-sdk','@satsails/sdk-react','@satsails/p2p-schemas']
          const packages = Object.fromEntries(names.map((name) => {
            const row = lock.packages['node_modules/' + name]
            return [name, row ? { version: row.version, resolved: row.resolved, integrity: row.integrity } : null]
          }))
          console.log(JSON.stringify({ packages }, null, 2))
          NODE

      - name: Install exact Sails Protocol node source
        working-directory: sails-protocol
        run: npm ci

      - name: Build node workspace packages
        working-directory: sails-protocol
        run: npm run build -w @sails/core -w @satsails/p2p-schemas -w @satsails/p2p-trading-sdk

      - name: Generate Prisma client
        working-directory: sails-protocol
        run: npm run db:generate

      - name: Apply database migrations
        working-directory: sails-protocol
        env:
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/sails_protocol
        run: npm run db:migrate

      - name: Start exact-source node with rail-scoped market arbitration
        working-directory: sails-protocol
        env:
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/sails_protocol
          REDIS_URL: redis://127.0.0.1:6379
          PORT: '3000'
          HOST: 0.0.0.0
          NODE_ENV: development
          MOCK_ESCROW: 'true'
          MOCK_SETTLEMENT: 'true'
          AUTO_SETTLE_ON_MATCH: 'false'
          ENFORCE_CAPABILITIES: 'false'
          REQUIRE_DUAL_APPROVAL_RELEASE: 'false'
          QVAC_AUTO_RESOLUTION_ENABLED: 'false'
          SOCIAL_ENGINEERING_DETECTION: 'false'
          ARBITRATION_MODE: trusted-list
          ARBITRATION_POLICY_BY_ESCROW_TYPE: MOCK=market
          TRUSTED_ARBITRATORS: ''
        run: |
          nohup ./node_modules/.bin/ts-node --transpile-only src/main.ts > ../sails-node-past-authority.log 2>&1 &
          echo $! > ../sails-node.pid

      - name: Wait for node health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/health > health.json; then
              cat health.json
              exit 0
            fi
            sleep 2
          done
          echo "Sails node did not become healthy" >&2
          cat sails-node-past-authority.log >&2 || true
          exit 1

      - name: Run published-SDK past-authority scenario
        working-directory: starter
        env:
          SAILS_BASE_URL: ${{ env.STARTER_BASE_URL }}
        run: npm run example:past-authority 2>&1 | tee past-authority.log

      - name: Verify authority-transition evidence
        working-directory: starter
        run: |
          grep -Eq '^OLD_ARBITER participantId=[^ ]+ collateral=' past-authority.log
          grep -Eq '^PARTIES sellerId=[^ ]+ buyerId=[^ ]+' past-authority.log
          grep -Eq '^FIRST_ASSIGNMENT disputeId=[^ ]+ arbiterId=[^ ]+ appealRound=0$' past-authority.log
          grep -Eq '^FIRST_RULING disputeId=[^ ]+ status=RESOLVED ruling=RELEASE$' past-authority.log
          grep -Eq '^NEW_ARBITER participantId=[^ ]+ collateral=' past-authority.log
          grep -Eq '^APPEAL_STATE disputeId=[^ ]+ status=APPEALED appealRound=1 previousArbiterId=[^ ]+ arbiterId=[^ ]+$' past-authority.log
          grep -Fq 'STALE_AUTHORITY_REJECTED class=SailsForbiddenError code=FORBIDDEN status=403' past-authority.log
          grep -Eq '^POST_REJECTION disputeId=[^ ]+ status=APPEALED appealRound=1 previousArbiterId=[^ ]+ arbiterId=[^ ]+$' past-authority.log
          grep -Eq '^EVIDENCE tradeId=[^ ]+ escrowId=[^ ]+ escrowType=MOCK disputeId=[^ ]+ oldArbiterId=[^ ]+ newArbiterId=[^ ]+ rejectionClass=SailsForbiddenError rejectionCode=FORBIDDEN rejectionStatus=403 finalStatus=APPEALED appealRound=1$' past-authority.log

      - name: Write scenario manifest
        if: always()
        working-directory: starter
        run: |
          {
            echo "scenario=Previous arbiter cannot resolve after appeal reassignment"
            echo "protocol_repository=${PROTOCOL_REPOSITORY}"
            echo "protocol_source_sha=${PROTOCOL_SOURCE_SHA}"
            echo "starter_source_sha=${STARTER_SOURCE_SHA}"
            echo "starter_checkout_sha=$(git rev-parse HEAD)"
            echo "command=npm run example:past-authority"
            echo "arbitration_mode=trusted-list"
            echo "arbitration_policy_by_escrow_type=MOCK=market"
            echo "settlement_scope=MOCK only; sequential stale-authority validation; no real settlement rail"
          } > past-authority-scenario-manifest.txt

      - name: Upload durable scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: past-authority-beta-${{ github.run_id }}
          path: |
            starter/past-authority.log
            starter/registry-baseline.json
            starter/past-authority-scenario-manifest.txt
            health.json
            sails-node-past-authority.log
          if-no-files-found: warn
          retention-days: 30
