name: In-Flight Appeal Race Beta Scenario

on:
  pull_request:
    paths:
      - '.github/workflows/in-flight-appeal-race-beta.yml'
      - 'examples/in-flight-appeal-race.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROTOCOL_REPOSITORY: alan-schramm/Sails-Protocol
  PROTOCOL_SOURCE_SHA: f7010d787160f1d04d8e4be0f94e3190cd242c8b
  STARTER_BASE_URL: http://127.0.0.1:3000
  STARTER_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  in-flight-appeal-race-public-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Each matrix leg gets its own fresh Postgres/Redis service containers
    # (a new job = a new runner = new, empty service containers) — real
    # process/data isolation between the 3 repeated trials, not a
    # harness-side reset hook. MarketArbitrationProvider.assign() does a
    # real weighted-random pick across EVERY currently-registered eligible
    # arbiter with no unregister/reset endpoint in the public API, so
    # trials sharing one node would let an earlier trial's arbiter leak
    # into a later trial's own "sole eligible candidate" pool — see
    # examples/in-flight-appeal-race.ts's own header for the full
    # reasoning. "A single lucky race is not sufficient" is satisfied by
    # these 3 independent legs, each exercising a genuinely fresh overlap.
    strategy:
      fail-fast: false
      matrix:
        trial: [trial-a, trial-b, trial-c]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sails_protocol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout exact external starter source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.STARTER_SOURCE_SHA }}
          path: starter

      - name: Checkout exact Sails Protocol source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.PROTOCOL_REPOSITORY }}
          ref: ${{ env.PROTOCOL_SOURCE_SHA }}
          path: sails-protocol
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install external registry consumer
        working-directory: starter
        run: npm ci

      - name: Record published SDK baseline
        working-directory: starter
        run: |
          npm ls @satsails/p2p-trading-sdk@0.2.0
          npm ls @satsails/sdk-react@0.2.0
          npm ls @satsails/p2p-schemas@0.2.0
          node - <<'NODE' > registry-baseline.json
          const fs = require('fs')
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          const names = ['@satsails/p2p-trading-sdk','@satsails/sdk-react','@satsails/p2p-schemas']
          const packages = Object.fromEntries(names.map((name) => {
            const row = lock.packages['node_modules/' + name]
            return [name, row ? { version: row.version, resolved: row.resolved, integrity: row.integrity } : null]
          }))
          console.log(JSON.stringify({ packages }, null, 2))
          NODE

      - name: Install exact Sails Protocol node source
        working-directory: sails-protocol
        run: npm ci

      - name: Build node workspace packages
        working-directory: sails-protocol
        run: npm run build -w @sails/core -w @satsails/p2p-schemas -w @satsails/p2p-trading-sdk

      - name: Generate Prisma client
        working-directory: sails-protocol
        run: npm run db:generate

      - name: Apply database migrations
        working-directory: sails-protocol
        env:
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/sails_protocol
        run: npm run db:migrate

      - name: Start exact-source node with rail-scoped market arbitration
        working-directory: sails-protocol
        env:
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/sails_protocol
          REDIS_URL: redis://127.0.0.1:6379
          PORT: '3000'
          HOST: 0.0.0.0
          NODE_ENV: development
          MOCK_ESCROW: 'true'
          MOCK_SETTLEMENT: 'true'
          AUTO_SETTLE_ON_MATCH: 'false'
          ENFORCE_CAPABILITIES: 'false'
          REQUIRE_DUAL_APPROVAL_RELEASE: 'false'
          QVAC_AUTO_RESOLUTION_ENABLED: 'false'
          SOCIAL_ENGINEERING_DETECTION: 'false'
          ARBITRATION_MODE: trusted-list
          ARBITRATION_POLICY_BY_ESCROW_TYPE: MOCK=market
          TRUSTED_ARBITRATORS: ''
        run: |
          nohup ./node_modules/.bin/ts-node --transpile-only src/main.ts > ../sails-node-in-flight-appeal-race.log 2>&1 &
          echo $! > ../sails-node.pid

      - name: Wait for node health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/health > health.json; then
              cat health.json
              exit 0
            fi
            sleep 2
          done
          echo "Sails node did not become healthy" >&2
          cat sails-node-in-flight-appeal-race.log >&2 || true
          exit 1

      - name: Run published-SDK in-flight appeal-race scenario
        working-directory: starter
        env:
          SAILS_BASE_URL: ${{ env.STARTER_BASE_URL }}
          BETA_225_TRIAL_ID: ${{ matrix.trial }}
        run: npm run example:in-flight-appeal-race 2>&1 | tee in-flight-appeal-race.log

      - name: Verify overlap evidence
        working-directory: starter
        run: |
          grep -Eq '^OLD_ARBITER participantId=[^ ]+ collateral=' in-flight-appeal-race.log
          grep -Eq '^PARTIES sellerId=[^ ]+ buyerId=[^ ]+' in-flight-appeal-race.log
          grep -Eq '^FIRST_ASSIGNMENT disputeId=[^ ]+ arbiterId=[^ ]+ appealRound=0$' in-flight-appeal-race.log
          grep -Eq '^NEW_ARBITER participantId=[^ ]+ collateral=' in-flight-appeal-race.log
          grep -Eq '^SIGNED_DECISION disputeId=[^ ]+ appealRound=0 authorityId=[^ ]+ outcome=RELEASE issuedAt=[^ ]+ digest=[0-9a-f]+$' in-flight-appeal-race.log
          grep -Eq '^RESOLVE_ATTEMPT settled=(fulfilled|rejected) ms=' in-flight-appeal-race.log
          grep -Eq '^APPEAL_ATTEMPT settled=(fulfilled|rejected) ms=' in-flight-appeal-race.log
          grep -Eq '^FINAL_STATE disputeId=[^ ]+ status=(RESOLVED|APPEALED) appealRound=[0-9]+ arbiterId=[^ ]+ previousArbiterId=[^ ]* ruling=[^ ]*$' in-flight-appeal-race.log
          grep -Eq '^ORDERING (RESOLVE_COMMITS_APPEAL_TOO_EARLY|RESOLVE_COMMITS_APPEAL_ALSO_SUCCEEDS|APPEAL_COMMITS_RESOLVE_REJECTED)$' in-flight-appeal-race.log
          grep -Fq 'staleOverwriteDetected=false' in-flight-appeal-race.log
          ! grep -Fq 'FORBIDDEN STATE' in-flight-appeal-race.log
          ! grep -Fq 'BETA_225_FAILED' in-flight-appeal-race.log

      - name: Write scenario manifest
        if: always()
        working-directory: starter
        run: |
          {
            echo "scenario=In-flight arbiter resolve cannot overwrite newer appeal generation"
            echo "issue=225"
            echo "trial=${{ matrix.trial }}"
            echo "protocol_repository=${PROTOCOL_REPOSITORY}"
            echo "protocol_source_sha=${PROTOCOL_SOURCE_SHA}"
            echo "starter_source_sha=${STARTER_SOURCE_SHA}"
            echo "starter_checkout_sha=$(git rev-parse HEAD)"
            echo "command=npm run example:in-flight-appeal-race"
            echo "arbitration_mode=trusted-list"
            echo "arbitration_policy_by_escrow_type=MOCK=market"
            echo "settlement_scope=MOCK only; genuinely concurrent old-arbiter-resolve vs participant-appeal overlap; no real settlement rail"
            echo "ordering=$(grep -E '^ORDERING ' in-flight-appeal-race.log | tail -1 | cut -d' ' -f2)"
          } > in-flight-appeal-race-scenario-manifest.txt

      - name: Upload durable scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: in-flight-appeal-race-beta-${{ matrix.trial }}-${{ github.run_id }}
          path: |
            starter/in-flight-appeal-race.log
            starter/registry-baseline.json
            starter/in-flight-appeal-race-scenario-manifest.txt
            health.json
            sails-node-in-flight-appeal-race.log
          if-no-files-found: warn
          retention-days: 30
