name: Disputed Escrow Beta Lifecycle

on:
  pull_request:
    paths:
      - '.github/workflows/disputed-escrow-beta-lifecycle.yml'
      - 'examples/escrow-with-arbitration.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROTOCOL_REPOSITORY: alan-schramm/Sails-Protocol
  PROTOCOL_SOURCE_SHA: a66e27bf64766cdf2b3e2acc41aefe90a71b95f7
  STARTER_BASE_URL: http://127.0.0.1:3000
  STARTER_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  disputed-public-sdk-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sails_protocol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout exact external starter source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.STARTER_SOURCE_SHA }}
          path: starter

      - name: Checkout exact Sails Protocol node source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.PROTOCOL_REPOSITORY }}
          ref: ${{ env.PROTOCOL_SOURCE_SHA }}
          path: sails-protocol
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install external registry consumer
        working-directory: starter
        run: npm ci

      - name: Record published SDK baseline
        working-directory: starter
        run: |
          npm ls @satsails/p2p-trading-sdk@0.2.0
          npm ls @satsails/sdk-react@0.2.0
          npm ls @satsails/p2p-schemas@0.2.0
          node - <<'NODE' > registry-baseline.json
          const fs = require('fs')
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          const names = [
            '@satsails/p2p-trading-sdk',
            '@satsails/sdk-react',
            '@satsails/p2p-schemas',
          ]
          const packages = Object.fromEntries(names.map((name) => {
            const key = 'node_modules/' + name
            const row = lock.packages[key]
            return [name, row ? { version: row.version, resolved: row.resolved, integrity: row.integrity } : null]
          }))
          console.log(JSON.stringify({ packages }, null, 2))
          NODE

      - name: Install exact Sails Protocol node source
        working-directory: sails-protocol
        run: npm ci

      - name: Build node workspace packages
        working-directory: sails-protocol
        run: npm run build -w @sails/core -w @satsails/p2p-schemas -w @satsails/p2p-trading-sdk

      - name: Generate Prisma client
        working-directory: sails-protocol
        run: npm run db:generate

      - name: Apply database migrations
        working-directory: sails-protocol
        env:
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/sails_protocol
        run: npm run db:migrate

      - name: Start bootstrap node without trusted arbiter
        working-directory: sails-protocol
        env:
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/sails_protocol
          REDIS_URL: redis://127.0.0.1:6379
          PORT: '3000'
          HOST: 0.0.0.0
          NODE_ENV: development
          MOCK_ESCROW: 'true'
          MOCK_SETTLEMENT: 'true'
          AUTO_SETTLE_ON_MATCH: 'false'
          ENFORCE_CAPABILITIES: 'false'
          REQUIRE_DUAL_APPROVAL_RELEASE: 'false'
          QVAC_AUTO_RESOLUTION_ENABLED: 'false'
          SOCIAL_ENGINEERING_DETECTION: 'false'
          TRUSTED_ARBITRATORS: ''
        run: |
          nohup npx ts-node --transpile-only src/main.ts > ../sails-node-bootstrap.log 2>&1 &
          echo $! > ../sails-node.pid

      - name: Wait for bootstrap node health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/health > health-bootstrap.json; then
              cat health-bootstrap.json
              exit 0
            fi
            sleep 2
          done
          echo "Bootstrap Sails node did not become healthy" >&2
          cat sails-node-bootstrap.log >&2 || true
          exit 1

      - name: Bootstrap deterministic arbiter identity through public SDK
        working-directory: starter
        env:
          SAILS_BASE_URL: ${{ env.STARTER_BASE_URL }}
          SAILS_ARBITER_BOOTSTRAP_ONLY: 'true'
        run: |
          npm run example:escrow-with-arbitration 2>&1 | tee arbiter-bootstrap.log
          ARBITER_ID="$(sed -n 's/^ARBITER_EVIDENCE participantId=//p' arbiter-bootstrap.log | tail -n 1)"
          test -n "$ARBITER_ID"
          echo "ARBITER_PARTICIPANT_ID=$ARBITER_ID" >> "$GITHUB_ENV"
          echo "$ARBITER_ID" > arbiter-participant-id.txt

      - name: Stop bootstrap node
        run: |
          kill "$(cat sails-node.pid)"
          for attempt in $(seq 1 30); do
            if ! kill -0 "$(cat sails-node.pid)" 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Bootstrap node did not stop cleanly" >&2
          exit 1

      - name: Start exact-source node with deterministic trusted arbiter
        working-directory: sails-protocol
        env:
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/sails_protocol
          REDIS_URL: redis://127.0.0.1:6379
          PORT: '3000'
          HOST: 0.0.0.0
          NODE_ENV: development
          MOCK_ESCROW: 'true'
          MOCK_SETTLEMENT: 'true'
          AUTO_SETTLE_ON_MATCH: 'false'
          ENFORCE_CAPABILITIES: 'false'
          REQUIRE_DUAL_APPROVAL_RELEASE: 'false'
          QVAC_AUTO_RESOLUTION_ENABLED: 'false'
          SOCIAL_ENGINEERING_DETECTION: 'false'
          TRUSTED_ARBITRATORS: ${{ env.ARBITER_PARTICIPANT_ID }}
        run: |
          nohup npx ts-node --transpile-only src/main.ts > ../sails-node-dispute.log 2>&1 &
          echo $! > ../sails-node.pid

      - name: Wait for dispute node health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/health > health-dispute.json; then
              cat health-dispute.json
              exit 0
            fi
            sleep 2
          done
          echo "Dispute Sails node did not become healthy" >&2
          cat sails-node-dispute.log >&2 || true
          exit 1

      - name: Run external public-SDK disputed escrow lifecycle
        working-directory: starter
        env:
          SAILS_BASE_URL: ${{ env.STARTER_BASE_URL }}
          SAILS_EXPECTED_ARBITER_ID: ${{ env.ARBITER_PARTICIPANT_ID }}
        run: |
          npm run example:escrow-with-arbitration 2>&1 | tee disputed-lifecycle.log

      - name: Verify bounded dispute lifecycle evidence
        working-directory: starter
        run: |
          grep -Fq "ARBITER_EVIDENCE participantId=${ARBITER_PARTICIPANT_ID}" disputed-lifecycle.log
          grep -Fq 'seller session established' disputed-lifecycle.log
          grep -Fq 'buyer session established' disputed-lifecycle.log
          grep -Fq 'escrow status after lock: FUNDS_LOCKED' disputed-lifecycle.log
          grep -Fq 'payment marked sent' disputed-lifecycle.log
          grep -Eq "dispute [^ ]+ opened, assigned to arbiter ${ARBITER_PARTICIPANT_ID}" disputed-lifecycle.log
          grep -Eq 'dispute [^ ]+ resolved: status=RESOLVED, ruling=RELEASE' disputed-lifecycle.log
          grep -Eq "EVIDENCE tradeId=[^ ]+ tradeStatus=[^ ]+ escrowId=[^ ]+ escrowStatus=COMPLETED escrowType=MOCK disputeId=[^ ]+ disputeStatus=RESOLVED ruling=RELEASE arbiterId=${ARBITER_PARTICIPANT_ID}" disputed-lifecycle.log

      - name: Write scenario manifest
        if: always()
        working-directory: starter
        run: |
          {
            echo "scenario=External SDK consumer completes disputed escrow resolution lifecycle"
            echo "protocol_repository=${PROTOCOL_REPOSITORY}"
            echo "protocol_source_sha=${PROTOCOL_SOURCE_SHA}"
            echo "starter_source_sha=${STARTER_SOURCE_SHA}"
            echo "starter_checkout_sha=$(git rev-parse HEAD)"
            echo "command=npm run example:escrow-with-arbitration"
            echo "arbiter_participant_id=${ARBITER_PARTICIPANT_ID:-UNAVAILABLE}"
            echo "trusted_arbitrators=${ARBITER_PARTICIPANT_ID:-UNAVAILABLE}"
            echo "settlement_scope=MOCK disputed lifecycle validation only; no real BTC movement"
          } > disputed-scenario-manifest.txt

      - name: Upload durable disputed scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disputed-escrow-beta-lifecycle-${{ github.run_id }}
          path: |
            starter/arbiter-bootstrap.log
            starter/arbiter-participant-id.txt
            starter/disputed-lifecycle.log
            starter/registry-baseline.json
            starter/disputed-scenario-manifest.txt
            health-bootstrap.json
            health-dispute.json
            sails-node-bootstrap.log
            sails-node-dispute.log
          if-no-files-found: warn
          retention-days: 30
