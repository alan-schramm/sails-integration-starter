name: Past Authority Beta Scenario\n\non:\n  pull_request:\n    paths:\n      - '.github/workflows/past-authority-beta.yml'\n      - 'examples/past-authority.ts'\n      - 'package.json'\n      - 'package-lock.json'\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\nenv:\n  PROTOCOL_REPOSITORY: alan-schramm/Sails-Protocol\n  PROTOCOL_SOURCE_SHA: deb4537726c4376c7693f0804fbfd7389e322e30\n  STARTER_BASE_URL: http://127.0.0.1:3000\n  STARTER_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}\n\njobs:\n  past-authority-public-sdk:\n    runs-on: ubuntu-latest\n    timeout-minutes: 30\n\n    services:\n      postgres:\n        image: postgres:16-alpine\n        env:\n          POSTGRES_USER: postgres\n          POSTGRES_PASSWORD: password\n          POSTGRES_DB: sails_protocol\n        ports:\n          - 5432:5432\n        options: >-\n          --health-cmd "pg_isready -U postgres"\n          --health-interval 5s\n          --health-timeout 5s\n          --health-retries 10\n      redis:\n        image: redis:7-alpine\n        ports:\n          - 6379:6379\n        options: >-\n          --health-cmd "redis-cli ping"\n          --health-interval 5s\n          --health-timeout 5s\n          --health-retries 10\n\n    steps:\n      - name: Checkout exact external starter source\n        uses: actions/checkout@v6\n        with:\n          ref: ${{ env.STARTER_SOURCE_SHA }}\n          path: starter\n\n      - name: Checkout exact Sails Protocol source\n        uses: actions/checkout@v6\n        with:\n          repository: ${{ env.PROTOCOL_REPOSITORY }}\n          ref: ${{ env.PROTOCOL_SOURCE_SHA }}\n          path: sails-protocol\n          persist-credentials: false\n\n      - name: Set up Node.js\n        uses: actions/setup-node@v6\n        with:\n          node-version: '24'\n\n      - name: Install external registry consumer\n        working-directory: starter\n        run: npm ci\n\n      - name: Record published SDK baseline\n        working-directory: starter\n        run: |\n          npm ls @satsails/p2p-trading-sdk@0.2.0\n          npm ls @satsails/sdk-react@0.2.0\n          npm ls @satsails/p2p-schemas@0.2.0\n          node - <<'NODE' > registry-baseline.json\n          const fs = require('fs')\n          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))\n          const names = ['@satsails/p2p-trading-sdk','@satsails/sdk-react','@satsails/p2p-schemas']\n          const packages = Object.fromEntries(names.map((name) => {\n            const row = lock.packages['node_modules/' + name]\n            return [name, row ? { version: row.version, resolved: row.resolved, integrity: row.integrity } : null]\n          }))\n          console.log(JSON.stringify({ packages }, null, 2))\n          NODE\n\n      - name: Install exact Sails Protocol node source\n        working-directory: sails-protocol\n        run: npm ci\n\n      - name: Build node workspace packages\n        working-directory: sails-protocol\n        run: npm run build -w @sails/core -w @satsails/p2p-schemas -w @satsails/p2p-trading-sdk\n\n      - name: Generate Prisma client\n        working-directory: sails-protocol\n        run: npm run db:generate\n\n      - name: Apply database migrations\n        working-directory: sails-protocol\n        env:\n          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/sails_protocol\n        run: npm run db:migrate\n\n      - name: Start exact-source node with rail-scoped market arbitration\n        working-directory: sails-protocol\n        env:\n          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/sails_protocol\n          REDIS_URL: redis://127.0.0.1:6379\n          PORT: '3000'\n          HOST: 0.0.0.0\n          NODE_ENV: development\n          MOCK_ESCROW: 'true'\n          MOCK_SETTLEMENT: 'true'\n          AUTO_SETTLE_ON_MATCH: 'false'\n          ENFORCE_CAPABILITIES: 'false'\n          REQUIRE_DUAL_APPROVAL_RELEASE: 'false'\n          QVAC_AUTO_RESOLUTION_ENABLED: 'false'\n          SOCIAL_ENGINEERING_DETECTION: 'false'\n          ARBITRATION_MODE: trusted-list\n          ARBITRATION_POLICY_BY_ESCROW_TYPE: MOCK=market\n          TRUSTED_ARBITRATORS: ''\n        run: |\n          nohup ./node_modules/.bin/ts-node --transpile-only src/main.ts > ../sails-node-past-authority.log 2>&1 &\n          echo $! > ../sails-node.pid\n\n      - name: Wait for node health\n        run: |\n          for attempt in $(seq 1 60); do\n            if curl --fail --silent http://127.0.0.1:3000/health > health.json; then\n              cat health.json\n              exit 0\n            fi\n            sleep 2\n          done\n          echo "Sails node did not become healthy" >&2\n          cat sails-node-past-authority.log >&2 || true\n          exit 1\n\n      - name: Run published-SDK past-authority scenario\n        working-directory: starter\n        env:\n          SAILS_BASE_URL: ${{ env.STARTER_BASE_URL }}\n        run: npm run example:past-authority 2>&1 | tee past-authority.log\n\n      - name: Verify authority-transition evidence\n        working-directory: starter\n        run: |\n          grep -Eq '^OLD_ARBITER participantId=[^ ]+ collateral=' past-authority.log\n          grep -Eq '^PARTIES sellerId=[^ ]+ buyerId=[^ ]+' past-authority.log\n          grep -Eq '^FIRST_ASSIGNMENT disputeId=[^ ]+ arbiterId=[^ ]+ appealRound=0$' past-authority.log\n          grep -Eq '^FIRST_RULING disputeId=[^ ]+ status=RESOLVED ruling=RELEASE$' past-authority.log\n          grep -Eq '^NEW_ARBITER participantId=[^ ]+ collateral=' past-authority.log\n          grep -Eq '^APPEAL_STATE disputeId=[^ ]+ status=APPEALED appealRound=1 previousArbiterId=[^ ]+ arbiterId=[^ ]+$' past-authority.log\n          grep -Fq 'STALE_AUTHORITY_REJECTED class=SailsForbiddenError code=FORBIDDEN status=403' past-authority.log\n          grep -Eq '^POST_REJECTION disputeId=[^ ]+ status=APPEALED appealRound=1 previousArbiterId=[^ ]+ arbiterId=[^ ]+$' past-authority.log\n          grep -Eq '^EVIDENCE tradeId=[^ ]+ escrowId=[^ ]+ escrowType=MOCK disputeId=[^ ]+ oldArbiterId=[^ ]+ newArbiterId=[^ ]+ rejectionClass=SailsForbiddenError rejectionCode=FORBIDDEN rejectionStatus=403 finalStatus=APPEALED appealRound=1$' past-authority.log\n\n      - name: Write scenario manifest\n        if: always()\n        working-directory: starter\n        run: |\n          {\n            echo "scenario=Previous arbiter cannot resolve after appeal reassignment"\n            echo "protocol_repository=${PROTOCOL_REPOSITORY}"\n            echo "protocol_source_sha=${PROTOCOL_SOURCE_SHA}"\n            echo "starter_source_sha=${STARTER_SOURCE_SHA}"\n            echo "starter_checkout_sha=$(git rev-parse HEAD)"\n            echo "command=npm run example:past-authority"\n            echo "arbitration_mode=trusted-list"\n            echo "arbitration_policy_by_escrow_type=MOCK=market"\n            echo "settlement_scope=MOCK only; sequential stale-authority validation; no real settlement rail"\n          } > past-authority-scenario-manifest.txt\n\n      - name: Upload durable scenario evidence\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: past-authority-beta-${{ github.run_id }}\n          path: |\n            starter/past-authority.log\n            starter/registry-baseline.json\n            starter/past-authority-scenario-manifest.txt\n            health.json\n            sails-node-past-authority.log\n          if-no-files-found: warn\n          retention-days: 30\n